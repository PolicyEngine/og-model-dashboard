name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Verify built artifact references the bundle
        run: |
          test -f dist/index.html
          grep -q '/assets/index-' dist/index.html

      - name: Verify static-asset references resolve
        run: |
          # Anything we link as `/papers/...` etc. must exist under public/.
          missing=0
          paths=$(grep -REho 'href="/[^"]+"|src="/[^"]+"' src \
                    | sed -E 's/^[^"]+"([^"]+)".*/\1/' \
                    | grep -vE '^/(assets|src)/' \
                    | sort -u)
          for p in $paths; do
            f="public${p}"
            if [ ! -f "$f" ]; then
              echo "Missing static asset: public${p} (referenced as ${p})"
              missing=1
            fi
          done
          exit $missing

      - name: Verify Code-tab API claims against upstream OG-UK
        run: |
          # Cheap structural check: every oguk symbol cited in the Code tab
          # must still be re-exported by the upstream package.
          curl -sL https://raw.githubusercontent.com/PSLmodels/OG-UK/main/oguk/__init__.py -o /tmp/oguk_init.py || {
            echo "Could not fetch upstream OG-UK __init__.py — skipping"
            exit 0
          }
          missing=0
          for sym in solve_steady_state run_transition_path map_to_real_world map_transition_to_real_world; do
            if ! grep -q "\"$sym\"" /tmp/oguk_init.py; then
              echo "Symbol no longer exported by oguk: $sym (Code tab references it)"
              missing=1
            fi
          done
          exit $missing
